{% extends "base.html" %}

{% block title %}Login | Employee Management System{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="form-card">
                    <div class="text-center mb-4">
                        <span class="section-label">Administrator Access</span>
                        <h1 class="h2 fw-bold mt-2">Welcome Back</h1>
                        <p class="text-muted mb-0">
                            Sign in to manage employee records.
                        </p>
                    </div>

                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                name="username"
                                required
                                autocomplete="username"
                                value="{{ request.form.get('username', '') }}"
                            >
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                required
                                autocomplete="current-password"
                            >
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2">
                            Login
                        </button>
                    </form>
                    <p class="text-end mt-3 mb-0"><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>

                    <p class="text-center text-muted mt-4 mb-0">
                        Don't have an account?
                        <a href="{{ url_for('register') }}" class="text-decoration-none">
                            Register
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
