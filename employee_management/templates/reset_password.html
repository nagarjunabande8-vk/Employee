{% extends "base.html" %}
{% block title %}Reset Password | Employee Management System{% endblock %}
{% block content %}
<section class="auth-section"><div class="container"><div class="row justify-content-center"><div class="col-md-7 col-lg-5"><div class="form-card"><span class="section-label">Account Recovery</span><h1 class="h2 fw-bold mt-2">Set a new password</h1><p class="text-muted">Choose a new password with at least 8 characters.</p><form method="POST"><div class="mb-3"><label for="password" class="form-label">New password</label><input class="form-control" type="password" id="password" name="password" minlength="8" required autocomplete="new-password"></div><div class="mb-4"><label for="confirm_password" class="form-label">Confirm new password</label><input class="form-control" type="password" id="confirm_password" name="confirm_password" minlength="8" required autocomplete="new-password"></div><button class="btn btn-primary w-100" type="submit">Update password</button></form></div></div></div></div></section>
{% endblock %}
