{% extends "base.html" %}

{% block title %}Register | Employee Management System{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="form-card">
                    <div class="text-center mb-4">
                        <span class="section-label">Administrator Registration</span>
                        <h1 class="h2 fw-bold mt-2">Create Account</h1>
                        <p class="text-muted mb-0">
                            Register an admin account to manage employees.
                        </p>
                    </div>

                    <form method="POST" action="{{ url_for('register') }}">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                name="username"
                                required
                                maxlength="50"
                                autocomplete="username"
                                value="{{ request.form.get('username', '') }}"
                            >
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email address (for password reset)</label>
                            <input type="email" class="form-control" id="email" name="email" maxlength="254" autocomplete="email" value="{{ request.form.get('email', '') }}">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                required
                                minlength="6"
                                autocomplete="new-password"
                            >
                            <div class="form-text">
                                Use at least 6 characters.
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="confirm_password" class="form-label">
                                Confirm Password
                            </label>
                            <input
                                type="password"
                                class="form-control"
                                id="confirm_password"
                                name="confirm_password"
                                required
                                minlength="6"
                                autocomplete="new-password"
                            >
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2">
                            Register
                        </button>
                    </form>

                    <p class="text-center text-muted mt-4 mb-0">
                        Already registered?
                        <a href="{{ url_for('login') }}" class="text-decoration-none">
                            Login
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
