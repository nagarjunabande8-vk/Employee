{% extends "base.html" %}

{% block title %}Contact | Employee Management System{% endblock %}

{% block content %}
<section class="page-header">
    <div class="container">
        <span class="section-label">Get in Touch</span>
        <h1 class="display-6 fw-bold mt-2">Contact Us</h1>
        <p class="lead text-muted mb-0">
            Send us your questions, feedback, or suggestions.
        </p>
    </div>
</section>

<section class="section-padding">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="form-card">
                    <form method="POST" action="{{ url_for('contact') }}">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="name" class="form-label">Name</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="name"
                                    name="name"
                                    required
                                    value="{{ request.form.get('name', '') }}"
                                >
                            </div>

                            <div class="col-md-6">
                                <label for="email" class="form-label">Email</label>
                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    required
                                    value="{{ request.form.get('email', '') }}"
                                >
                            </div>

                            <div class="col-12">
                                <label for="subject" class="form-label">Subject</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="subject"
                                    name="subject"
                                    required
                                    value="{{ request.form.get('subject', '') }}"
                                >
                            </div>

                            <div class="col-12">
                                <label for="message" class="form-label">Message</label>
                                <textarea
                                    class="form-control"
                                    id="message"
                                    name="message"
                                    rows="6"
                                    required
                                >{{ request.form.get('message', '') }}</textarea>
                            </div>

                            <div class="col-12">
                                <button type="submit" class="btn btn-primary px-4">
                                    Send Message
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
