{% extends "base.html" %}
{% block title %}Forgot Password | Employee Management System{% endblock %}
{% block content %}
<section class="auth-section"><div class="container"><div class="row justify-content-center"><div class="col-md-7 col-lg-5"><div class="form-card"><span class="section-label">Account Recovery</span><h1 class="h2 fw-bold mt-2">Forgot password?</h1><p class="text-muted">Enter the email address linked to your account. We'll email you a secure reset link.</p><form method="POST"><div class="mb-3"><label for="email" class="form-label">Registered email</label><input class="form-control" type="email" id="email" name="email" required maxlength="254" autocomplete="email"></div><button class="btn btn-primary w-100" type="submit">Send reset link</button></form><p class="text-center mt-4 mb-0"><a href="{{ url_for('login') }}">Back to login</a></p></div></div></div></div></section>
{% endblock %}
